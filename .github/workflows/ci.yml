name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # The parser, the golden set against the publication, the citation check, and the RAG and the agent
      # with a scripted model and search: no API key, no index, no embedding model
      - run: uv run pytest -q --cov=tax --cov=evals --cov-report=term
